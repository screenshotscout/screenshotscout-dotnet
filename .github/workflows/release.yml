# Publishes the ScreenshotScout package to NuGet.org when a vX.Y.Z tag is pushed,
# then creates the GitHub release from the tag message's body, with the .nupkg
# and .snupkg attached.
#
# Running it by hand (Actions > Release > Run workflow) is a dry run: it tests and
# packs, and never publishes. Give it the new version to also check the project.
# Tick "check credentials" to confirm that NuGet.org trusts this workflow (it gets
# a short-lived key and pushes nothing).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run only: fail unless the project says this version (for example 1.2.3)"
        required: false
        type: string
      check_credentials:
        description: "Also check NuGet trusted publishing for the release environment (publishes nothing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # net8.0 left support on 2026-11-10. Newer SDKs warn about that (NETSDK1138), and
      # TreatWarningsAsErrors in Directory.Build.props would turn the warning into a failure.
      CheckEolTargetFramework: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - run: dotnet test ScreenshotScout.sln -c Release

      - name: Check that the project has the release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then expected="${GITHUB_REF_NAME#v}"; else expected="$INPUT_VERSION"; fi
          actual="$(dotnet msbuild src/ScreenshotScout/ScreenshotScout.csproj -getProperty:Version)"
          echo "ScreenshotScout.csproj version: $actual"
          if [[ -n "$expected" && "$actual" != "$expected" ]]; then
            echo "::error::ScreenshotScout.csproj says $actual, but the release is $expected."
            exit 1
          fi

      # Pack the library project only: the examples in the solution aren't packable.
      - run: dotnet pack src/ScreenshotScout/ScreenshotScout.csproj -c Release -o artifacts -p:ContinuousIntegrationBuild=true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Read the release notes from the tag
        if: github.event_name == 'push'
        run: |
          # Fetch the tag object itself, so an annotated tag stays annotated.
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "::error::${GITHUB_REF_NAME} isn't an annotated tag, so it has no release notes. Create it with git tag -a."
            exit 1
          fi
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Tag ${GITHUB_REF_NAME} has no release notes. Write them in the tag message, below the subject line."
            exit 1
          fi
          cat release-notes.md

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  # Manual runs only: proves NuGet.org trusts this workflow by getting a key, which is never used.
  credentials:
    if: github.event_name == 'workflow_dispatch' && inputs.check_credentials
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      # NUGET_USER is the nuget.org profile of the person who owns the policy, not the
      # package's organization; it's a variable in the release environment.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - run: echo "NuGet.org accepted the trusted publishing policy."

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/

      # Trusted publishing: exchanges the workflow's OIDC token for a one-hour NuGet API key.
      # NUGET_USER is the policy owner's nuget.org profile (a variable in the release environment).
      - name: Log in to NuGet
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push the package (the .snupkg next to it goes along)
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet nuget push "artifacts/ScreenshotScout.$version.nupkg" \
            --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # NuGet validates and indexes a new package before serving it, which can take a while.
      - name: Wait until NuGet serves the new version
        run: |
          version="${GITHUB_REF_NAME#v}"
          lower="${version,,}"
          for _ in $(seq 1 120); do
            if curl -fsS https://api.nuget.org/v3-flatcontainer/screenshotscout/index.json \
              | jq -e --arg v "$lower" '.versions | index($v)' >/dev/null; then
              echo "ScreenshotScout $version is live on NuGet."
              exit 0
            fi
            sleep 15
          done
          echo "::error::ScreenshotScout $version isn't visible on NuGet after 30 minutes."
          exit 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The GitHub release for $GITHUB_REF_NAME already exists."
            exit 0
          fi
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ScreenshotScout $version" --notes-file release-notes.md "${flags[@]}" \
            "artifacts/ScreenshotScout.$version.nupkg" "artifacts/ScreenshotScout.$version.snupkg"
